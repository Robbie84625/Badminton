<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>羽球排程即時看板</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .court-net {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      margin-left: -1px;
      width: 2px;
      background: rgba(255, 255, 255, 0.4);
      border-right: 1px dashed rgba(255, 255, 255, 0.7);
    }
    .court-net-sub {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      margin-left: -1px;
      width: 2px;
      background: rgba(100, 116, 139, 0.3);
      border-right: 1px dashed rgba(100, 116, 139, 0.5);
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

  <!-- 頂部導覽列 -->
  <header class="bg-green-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-feather text-xl"></i>
        <h1 class="font-bold text-lg tracking-wide">羽球對戰即時看板</h1>
      </div>
      <div class="flex items-center space-x-2">
        <span id="sync-badge" class="text-xs bg-green-700 px-2 py-1 rounded-full border border-green-400 flex items-center space-x-1">
          <span class="w-2 h-2 rounded-full bg-green-300"></span>
          <span>連線中</span>
        </span>
        <button onclick="copyShareLink()" class="bg-green-700 hover:bg-green-800 text-xs px-2.5 py-1.5 rounded-lg flex items-center space-x-1 font-medium shadow-sm transition">
          <i class="fa-solid fa-share-nodes"></i>
          <span>分享</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-4 space-y-5">

    <!-- 當前對戰卡片 -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="bg-gray-50 border-b border-gray-200 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
          <h2 class="font-bold text-gray-700 text-base">目前賽況</h2>
          <span id="match-status-tag" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-200 text-gray-600">準備就緒</span>
        </div>
        <div id="match-actions" class="flex space-x-2">
          <button id="btn-swap-court" onclick="openSwapModal()" style="display: none;" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-3 py-1.5 rounded-lg transition">替換球員</button>
        </div>
      </div>

      <div class="p-5">
        <!-- 進行中的球場 -->
        <div id="court-view" style="display: none;">
          <div class="bg-green-800 rounded-xl p-4 text-white relative shadow-inner">
            <div class="grid grid-cols-2 gap-4 relative">
              <div class="court-net"></div>

              <div class="bg-green-900 bg-opacity-60 p-3 rounded-lg flex flex-col items-center justify-center min-h-24 border border-green-700">
                <div class="text-xs text-green-300 font-semibold mb-1">組合 A</div>
                <div id="team-a-display" class="text-lg md:text-xl font-black tracking-wide text-center"></div>
              </div>

              <div class="bg-green-900 bg-opacity-60 p-3 rounded-lg flex flex-col items-center justify-center min-h-24 border border-green-700">
                <div class="text-xs text-green-300 font-semibold mb-1">組合 B</div>
                <div id="team-b-display" class="text-lg md:text-xl font-black tracking-wide text-center"></div>
              </div>
            </div>
          </div>

          <div class="mt-3 flex items-center space-x-2 text-xs text-gray-500 bg-gray-50 p-2.5 rounded-lg border border-gray-200">
            <i class="fa-solid fa-mug-hot text-yellow-500"></i>
            <span class="font-bold">本場輪休：</span>
            <span id="resting-players" class="text-gray-700 font-medium">無</span>
          </div>
        </div>

        <div id="empty-court" class="py-10 text-center">
          <i class="fa-solid fa-people-arrows text-3xl text-gray-300 mb-2"></i>
          <p class="text-gray-500 text-sm font-medium">尚未開賽，請點擊下方按鈕開始排程出賽</p>
        </div>

        <!-- 預排下一場組合 -->
        <div id="upcoming-box" style="display: none;" class="mt-4 p-4 rounded-xl border border-blue-200 bg-blue-50/60">
          <div class="flex items-center space-x-2 mb-2">
            <i class="fa-solid fa-forward text-blue-600 text-sm"></i>
            <h3 class="text-sm font-bold text-blue-900">下一場預排陣容</h3>
            <span class="text-[11px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-medium">即時聯動</span>
          </div>

          <div class="bg-white rounded-lg p-3 border border-blue-100 relative shadow-sm">
            <div class="grid grid-cols-2 gap-4 relative">
              <div class="court-net-sub"></div>
              <div class="text-center p-2">
                <div class="text-[11px] text-gray-400 font-semibold mb-0.5">預定 A 組</div>
                <div id="upcoming-team-a" class="text-base font-bold text-gray-800"></div>
              </div>
              <div class="text-center p-2">
                <div class="text-[11px] text-gray-400 font-semibold mb-0.5">預定 B 組</div>
                <div id="upcoming-team-b" class="text-base font-bold text-gray-800"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 正式開打與完成比賽 共用同一顆按鈕 -->
        <button id="main-flow-btn" onclick="toggleMatchStatus()" class="mt-4 w-full py-3.5 rounded-xl font-bold flex items-center justify-center space-x-2 shadow-sm transition bg-green-600 hover:bg-green-700 text-white">
          <i class="fa-solid fa-play"></i>
          <span>正式開打（智慧排程）</span>
        </button>
      </div>
    </section>

    <!-- 球員名冊管理 -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
      <div class="flex justify-between items-center mb-3">
        <div>
          <h2 class="font-bold text-gray-800 text-base">球員名冊與出勤管理</h2>
          <p class="text-xs text-gray-400">一行代表一個人，儲存後鎖定，需按編輯方可修改</p>
        </div>
        <button onclick="toggleRosterEdit()" id="btn-edit-roster" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg font-medium transition flex items-center space-x-1">
          <i class="fa-solid fa-chevron-up" id="toggle-icon"></i>
          <span id="toggle-text">收合輸入框</span>
        </button>
      </div>

      <!-- 名單輸入框與鎖定/編輯狀態切換 -->
      <div id="roster-editor" style="display: block;" class="mb-4 p-3 bg-gray-50 rounded-xl border border-gray-200">
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-gray-500">球員名單（一行一位）：</label>
          <span id="roster-lock-status" class="text-[11px] px-2 py-0.5 rounded-full font-medium bg-gray-200 text-gray-600">
            <i class="fa-solid fa-lock text-[10px] mr-1"></i>已鎖定
          </span>
        </div>
        <textarea id="roster-textarea" rows="5" disabled placeholder="請在此輸入名單，一行一人&#10;王小明&#10;李小美&#10;陳大華&#10;張志豪" class="w-full text-sm font-medium p-2.5 border rounded-lg focus:outline-none transition bg-gray-100 border-gray-300 text-gray-500 cursor-not-allowed"></textarea>
        <div class="mt-2 flex justify-between items-center">
          <span class="text-xs text-gray-400" id="roster-tip">點擊右側「編輯名冊」以修改成員</span>
          <button id="btn-toggle-save" onclick="handleRosterButtonClick()" class="text-xs px-4 py-1.5 rounded-lg font-semibold shadow-sm transition flex items-center space-x-1 bg-gray-700 hover:bg-gray-800 text-white">
            <i class="fa-solid fa-pen-to-square"></i>
            <span>編輯名冊</span>
          </button>
        </div>
      </div>

      <!-- 球員統計表格 -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="text-xs text-gray-400 border-b border-gray-100 pb-2">
              <th class="py-2 font-medium">球員</th>
              <th class="py-2 font-medium text-center">已出賽</th>
              <th class="py-2 font-medium text-center">連賽/連休</th>
              <th class="py-2 font-medium text-right">出勤狀態</th>
            </tr>
          </thead>
          <tbody id="player-table-body" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>

      <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center text-xs">
        <span class="text-gray-400" id="total-summary">總在場人數: 0</span>
        <button onclick="openResetModal()" class="text-red-500 hover:text-red-700 font-medium flex items-center space-x-1">
          <i class="fa-solid fa-rotate-left"></i>
          <span>重置所有紀錄</span>
        </button>
      </div>
    </section>

    <!-- 對戰過的組合歷史 -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-clock-rotate-left text-green-600"></i>
          <h2 class="font-bold text-gray-800 text-base">已對戰組合紀錄</h2>
        </div>
        <span id="history-count" class="text-xs text-gray-400">共 0 場</span>
      </div>

      <div id="history-container" class="space-y-2">
        <div class="py-6 text-center text-gray-400 text-xs">尚無任何已完成的對戰紀錄</div>
      </div>
    </section>

  </main>

  <!-- 換人彈窗 -->
  <div id="swap-modal" style="display: none;" class="fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
      <h3 class="text-base font-bold text-gray-800 mb-2">更換當前場上球員</h3>
      <p class="text-xs text-gray-500 mb-4">選取體力不支或欲換下的選手，換為場下休息球員：</p>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-500 block mb-1">換下（目前場上）：</label>
          <select id="swap-out-select" class="w-full text-sm p-2 rounded-lg border border-gray-300"></select>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500 block mb-1">換上（場下休息）：</label>
          <select id="swap-in-select" class="w-full text-sm p-2 rounded-lg border border-gray-300"></select>
        </div>
      </div>

      <div class="mt-5 flex justify-end space-x-2">
        <button onclick="closeSwapModal()" class="px-3 py-1.5 text-xs font-semibold text-gray-500 bg-gray-100 rounded-lg">取消</button>
        <button onclick="confirmSwap()" class="px-3 py-1.5 text-xs font-semibold text-white bg-green-600 rounded-lg hover:bg-green-700">確認替換並聯動</button>
      </div>
    </div>
  </div>

  <!-- 重置確認彈窗 -->
  <div id="reset-modal" style="display: none;" class="fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl text-center">
      <i class="fa-solid fa-triangle-exclamation text-yellow-500 text-3xl mb-2"></i>
      <h3 class="text-base font-bold text-gray-800">確定重置全部紀錄？</h3>
      <p class="text-xs text-gray-500 mt-1 mb-4">球員名單保留，但場次、當前賽事及歷史紀錄皆會歸零。</p>
      <div class="flex justify-center space-x-2">
        <button onclick="closeResetModal()" class="px-4 py-1.5 text-xs font-semibold text-gray-500 bg-gray-100 rounded-lg">取消</button>
        <button onclick="executeReset()" class="px-4 py-1.5 text-xs font-semibold text-white bg-red-600 rounded-lg hover:bg-red-700">確定重置</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://badminton-e0324-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const roomId = window.location.hash.replace('#', '') || 'main-court';
    const roomRef = db.ref('rooms/' + roomId);

    let state = {
      players: [],
      currentMatch: null,
      upcomingMatch: null,
      history: []
    };

    let isEditingRoster = false; // 是否處於名冊編輯中狀態

    // 監聽雲端資料同步
    roomRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        state.players = data.players || [];
        state.currentMatch = data.currentMatch || null;
        state.upcomingMatch = data.upcomingMatch || null;
        state.history = data.history || [];
      } else {
        syncToFirebase();
      }
      render();
      syncTextareaWithState();
      document.getElementById('sync-badge').innerHTML = '<span class="w-2 h-2 rounded-full bg-green-300"></span> <span>即時同步中</span>';
    });

    function syncToFirebase() {
      roomRef.set(state);
    }

    function syncTextareaWithState() {
      const textarea = document.getElementById('roster-textarea');
      if (!isEditingRoster && document.activeElement !== textarea) {
        textarea.value = (state.players || []).map(p => p.name).join('\n');
      }
    }

    // 挑選 4 位選手核心
    function pickFourPlayers(playerPool) {
      if (playerPool.length < 4) return null;

      const scored = [...playerPool].map(p => {
        let score = (p.played || 0) * 10;
        if ((p.consecutivePlay || 0) >= 1) {
          score += (playerPool.length === 6 ? 100 : 25 * p.consecutivePlay);
        }
        if ((p.consecutiveRest || 0) > 0) {
          score -= (p.consecutiveRest * 15);
        }
        score += (Math.random() * 2);
        return { player: p, score };
      });

      scored.sort((a, b) => a.score - b.score);
      const chosen = scored.slice(0, 4).map(s => s.player);
      chosen.sort(() => Math.random() - 0.5);

      return {
        teamA: [chosen[0].id, chosen[1].id],
        teamB: [chosen[2].id, chosen[3].id]
      };
    }

    // 預排下一場演算法
    function generateUpcomingMatch(currentMatchSelection) {
      const activePlayers = (state.players || []).filter(p => p.status === 'active');
      if (activePlayers.length < 4) return null;

      const currentIds = [...currentMatchSelection.teamA, ...currentMatchSelection.teamB];

      const simulatedPlayers = activePlayers.map(p => {
        const copy = { ...p };
        if (currentIds.includes(copy.id)) {
          copy.played = (copy.played || 0) + 1;
          copy.consecutivePlay = (copy.consecutivePlay || 0) + 1;
          copy.consecutiveRest = 0;
        } else {
          copy.consecutivePlay = 0;
          copy.consecutiveRest = (copy.consecutiveRest || 0) + 1;
        }
        return copy;
      });

      return pickFourPlayers(simulatedPlayers);
    }

    // 共用按鈕：正式開打 / 完成比賽
    function toggleMatchStatus() {
      if (!state.currentMatch) {
        const activePlayers = (state.players || []).filter(p => p.status === 'active');
        if (activePlayers.length < 4) {
          alert('在場人數不足 4 人，無法安排雙打比賽！');
          return;
        }

        let matchToStart = state.upcomingMatch;
        const validUpcoming = matchToStart && [...matchToStart.teamA, ...matchToStart.teamB].every(id => 
          activePlayers.some(p => p.id === id)
        );

        if (!validUpcoming) {
          matchToStart = pickFourPlayers(activePlayers);
        }

        const matchNum = (state.history.length || 0) + 1;
        state.currentMatch = {
          ...matchToStart,
          matchNumber: matchNum
        };

        state.upcomingMatch = generateUpcomingMatch(state.currentMatch);

      } else {
        const currentIds = [...state.currentMatch.teamA, ...state.currentMatch.teamB];

        state.players.forEach(p => {
          if (currentIds.includes(p.id)) {
            p.played = (p.played || 0) + 1;
            p.consecutivePlay = (p.consecutivePlay || 0) + 1;
            p.consecutiveRest = 0;
          } else if (p.status === 'active') {
            p.consecutivePlay = 0;
            p.consecutiveRest = (p.consecutiveRest || 0) + 1;
          }
        });

        const getName = id => (state.players.find(p => p.id === id) || {}).name || '未知';
        state.history.unshift({
          matchNumber: state.currentMatch.matchNumber || (state.history.length + 1),
          teamANames: [getName(state.currentMatch.teamA[0]), getName(state.currentMatch.teamA[1])],
          teamBNames: [getName(state.currentMatch.teamB[0]), getName(state.currentMatch.teamB[1])],
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });

        state.currentMatch = null;
      }

      syncToFirebase();
    }

    // 換人：只替換目前場上球員，並聯動更新預排陣容
    function openSwapModal() {
      if (!state.currentMatch) return;
      const currentIds = [...state.currentMatch.teamA, ...state.currentMatch.teamB];
      const onCourt = state.players.filter(p => currentIds.includes(p.id));
      const onBench = state.players.filter(p => !currentIds.includes(p.id) && p.status === 'active');

      if (onBench.length === 0) {
        alert('目前場下沒有其他在場球員可供替換！');
        return;
      }

      const outSelect = document.getElementById('swap-out-select');
      const inSelect = document.getElementById('swap-in-select');
      outSelect.innerHTML = onCourt.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      inSelect.innerHTML = onBench.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

      document.getElementById('swap-modal').style.display = 'flex';
    }

    function closeSwapModal() {
      document.getElementById('swap-modal').style.display = 'none';
    }

    function confirmSwap() {
      if (!state.currentMatch) return;
      const outId = document.getElementById('swap-out-select').value;
      const inId = document.getElementById('swap-in-select').value;

      let { teamA, teamB } = state.currentMatch;
      if (teamA.includes(outId)) {
        teamA = teamA.map(id => id === outId ? inId : id);
      } else {
        teamB = teamB.map(id => id === outId ? inId : id);
      }
      state.currentMatch.teamA = teamA;
      state.currentMatch.teamB = teamB;

      state.upcomingMatch = generateUpcomingMatch(state.currentMatch);

      closeSwapModal();
      syncToFirebase();
    }

    function toggleRosterEdit() {
      const box = document.getElementById('roster-editor');
      const text = document.getElementById('toggle-text');
      const icon = document.getElementById('toggle-icon');
      
      const isHidden = box.style.display === 'none';
      if (isHidden) {
        box.style.display = 'block';
        text.textContent = '收合輸入框';
        icon.className = 'fa-solid fa-chevron-up';
      } else {
        box.style.display = 'none';
        text.textContent = '展開輸入框';
        icon.className = 'fa-solid fa-chevron-down';
      }
    }

    // 優化：編輯名冊與儲存名冊切換及文字框鎖定/解鎖
    function handleRosterButtonClick() {
      const textarea = document.getElementById('roster-textarea');
      const btn = document.getElementById('btn-toggle-save');
      const lockStatus = document.getElementById('roster-lock-status');
      const tip = document.getElementById('roster-tip');

      if (!isEditingRoster) {
        // 切換為編輯模式：解鎖輸入框
        isEditingRoster = true;
        textarea.disabled = false;
        textarea.className = "w-full text-sm font-medium p-2.5 border rounded-lg focus:outline-none transition bg-white border-green-500 ring-2 ring-green-100 text-gray-800 cursor-text";
        textarea.focus();

        lockStatus.innerHTML = '<i class="fa-solid fa-unlock text-[10px] mr-1"></i>編輯中';
        lockStatus.className = "text-[11px] px-2 py-0.5 rounded-full font-medium bg-amber-100 text-amber-700";

        tip.textContent = "修改完畢後請點擊「儲存名冊」";

        btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i><span>儲存名冊</span>';
        btn.className = "text-xs px-4 py-1.5 rounded-lg font-semibold shadow-sm transition flex items-center space-x-1 bg-green-600 hover:bg-green-700 text-white";

      } else {
        // 切換為鎖定模式：儲存資料並鎖定輸入框
        const lines = textarea.value
          .split('\n')
          .map(s => s.trim())
          .filter(s => s.length > 0);

        const existingPlayers = state.players || [];
        const newPlayers = lines.map(name => {
          const exist = existingPlayers.find(p => p.name === name);
          if (exist) return exist;
          return {
            id: '_' + Math.random().toString(36).substr(2, 9),
            name: name,
            status: 'active',
            played: 0,
            consecutivePlay: 0,
            consecutiveRest: 0
          };
        });

        state.players = newPlayers;
        if (state.currentMatch) {
          state.upcomingMatch = generateUpcomingMatch(state.currentMatch);
        }
        syncToFirebase();

        isEditingRoster = false;
        textarea.disabled = true;
        textarea.className = "w-full text-sm font-medium p-2.5 border rounded-lg focus:outline-none transition bg-gray-100 border-gray-300 text-gray-500 cursor-not-allowed";

        lockStatus.innerHTML = '<i class="fa-solid fa-lock text-[10px] mr-1"></i>已鎖定';
        lockStatus.className = "text-[11px] px-2 py-0.5 rounded-full font-medium bg-gray-200 text-gray-600";

        tip.textContent = "點擊右側「編輯名冊」以修改成員";

        btn.innerHTML = '<i class="fa-solid fa-pen-to-square mr-1"></i><span>編輯名冊</span>';
        btn.className = "text-xs px-4 py-1.5 rounded-lg font-semibold shadow-sm transition flex items-center space-x-1 bg-gray-700 hover:bg-gray-800 text-white";
      }
    }

    function changePlayerStatus(id, newStatus) {
      const p = (state.players || []).find(x => x.id === id);
      if (p) {
        p.status = newStatus;
        if (state.currentMatch) {
          state.upcomingMatch = generateUpcomingMatch(state.currentMatch);
        }
        syncToFirebase();
      }
    }

    function openResetModal() { document.getElementById('reset-modal').style.display = 'flex'; }
    function closeResetModal() { document.getElementById('reset-modal').style.display = 'none'; }
    function executeReset() {
      (state.players || []).forEach(p => {
        p.played = 0;
        p.consecutivePlay = 0;
        p.consecutiveRest = 0;
      });
      state.currentMatch = null;
      state.upcomingMatch = null;
      state.history = [];
      closeResetModal();
      syncToFirebase();
    }

    // 渲染畫面
    function render() {
      const courtView = document.getElementById('court-view');
      const emptyCourt = document.getElementById('empty-court');
      const upcomingBox = document.getElementById('upcoming-box');
      const swapBtn = document.getElementById('btn-swap-court');
      const tag = document.getElementById('match-status-tag');
      const mainBtn = document.getElementById('main-flow-btn');
      const players = state.players || [];
      const getName = id => (players.find(p => p.id === id) || {}).name || '未知';

      const isPlaying = !!state.currentMatch;

      if (!isPlaying) {
        courtView.style.display = 'none';
        emptyCourt.style.display = 'block';
        swapBtn.style.display = 'none';
        tag.textContent = '準備就緒';
        tag.className = 'text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 text-gray-500';

        mainBtn.innerHTML = '<i class="fa-solid fa-play"></i><span>正式開打（智慧排程）</span>';
        mainBtn.className = 'mt-4 w-full py-3.5 rounded-xl font-bold flex items-center justify-center space-x-2 shadow-sm transition bg-green-600 hover:bg-green-700 text-white';
      } else {
        courtView.style.display = 'block';
        emptyCourt.style.display = 'none';
        swapBtn.style.display = 'inline-block';
        tag.textContent = `第 ${state.currentMatch.matchNumber} 場進行中`;
        tag.className = 'text-xs font-semibold px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-bold';

        document.getElementById('team-a-display').textContent = `${getName(state.currentMatch.teamA[0])}  &  ${getName(state.currentMatch.teamA[1])}`;
        document.getElementById('team-b-display').textContent = `${getName(state.currentMatch.teamB[0])}  &  ${getName(state.currentMatch.teamB[1])}`;

        const playingIds = [...state.currentMatch.teamA, ...state.currentMatch.teamB];
        const resting = players.filter(p => p.status === 'active' && !playingIds.includes(p.id));
        document.getElementById('resting-players').textContent = resting.length > 0 ? resting.map(p => p.name).join('、') : '無人輪休';

        mainBtn.innerHTML = '<i class="fa-solid fa-flag-checkered"></i><span>完成本場比賽（結算並排下一場）</span>';
        mainBtn.className = 'mt-4 w-full py-3.5 rounded-xl font-bold flex items-center justify-center space-x-2 shadow-sm transition bg-yellow-500 hover:bg-yellow-600 text-white';
      }

      if (state.upcomingMatch) {
        upcomingBox.style.display = 'block';
        document.getElementById('upcoming-team-a').textContent = `${getName(state.upcomingMatch.teamA[0])}  &  ${getName(state.upcomingMatch.teamA[1])}`;
        document.getElementById('upcoming-team-b').textContent = `${getName(state.upcomingMatch.teamB[0])}  &  ${getName(state.upcomingMatch.teamB[1])}`;
      } else {
        upcomingBox.style.display = 'none';
      }

      const tbody = document.getElementById('player-table-body');
      if (players.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="py-6 text-center text-gray-400 text-xs">
              尚無球員，請在上方點擊「編輯名冊」輸入名單（一行一人），點擊「儲存名冊」即可建立。
            </td>
          </tr>
        `;
      } else {
        tbody.innerHTML = players.map(p => {
          const selectColorClass = p.status === 'active' 
            ? 'bg-green-50 text-green-700 border-green-200' 
            : (p.status === 'late' ? 'bg-yellow-50 text-yellow-700 border-yellow-200' : 'bg-gray-100 text-gray-600 border-gray-300');

          const statusSelect = `
            <select onchange="changePlayerStatus('${p.id}', this.value)" class="text-xs font-bold px-2 py-1 rounded-lg border focus:outline-none ${selectColorClass}">
              <option value="active" ${p.status === 'active' ? 'selected' : ''}>🟢 在場</option>
              <option value="late" ${p.status === 'late' ? 'selected' : ''}>🟡 遲到/未到</option>
              <option value="left" ${p.status === 'left' ? 'selected' : ''}>⚪ 早退</option>
            </select>
          `;

          return `
            <tr class="hover:bg-gray-50 transition">
              <td class="py-2.5 font-bold text-gray-800">${p.name}</td>
              <td class="py-2.5 text-center font-bold text-green-600">${p.played || 0}</td>
              <td class="py-2.5 text-center text-xs text-gray-500">
                ${(p.consecutivePlay || 0) > 0 ? `<span class="text-yellow-600 font-semibold">連打 ${p.consecutivePlay}</span>` : `連休 ${p.consecutiveRest || 0}`}
              </td>
              <td class="py-2.5 text-right">${statusSelect}</td>
            </tr>
          `;
        }).join('');
      }

      const activeCount = players.filter(p => p.status === 'active').length;
      document.getElementById('total-summary').textContent = `在場球員: ${activeCount} 人 / 總球員: ${players.length} 人`;

      const historyContainer = document.getElementById('history-container');
      const historyList = state.history || [];
      document.getElementById('history-count').textContent = `共 ${historyList.length} 場`;

      if (historyList.length === 0) {
        historyContainer.innerHTML = '<div class="py-6 text-center text-gray-400 text-xs">尚無任何已完成的對戰紀錄</div>';
      } else {
        historyContainer.innerHTML = historyList.map(h => `
          <div class="p-3 bg-gray-50 rounded-xl border border-gray-200 flex items-center justify-between text-xs">
            <div class="flex items-center space-x-2">
              <span class="bg-gray-200 text-gray-700 font-bold px-2 py-0.5 rounded-md text-[11px]">第 ${h.matchNumber} 場</span>
              <span class="text-gray-400 text-[11px]">${h.time}</span>
            </div>
            <div class="font-bold text-gray-800">
              <span class="text-green-700">${h.teamANames.join(' & ')}</span>
              <span class="mx-2 text-gray-400 font-normal">VS</span>
              <span class="text-blue-700">${h.teamBNames.join(' & ')}</span>
            </div>
          </div>
        `).join('');
      }
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert('已複製此看板網址！直接貼到 LINE 群組，大家點開就能看到即時排程。');
      });
    }
  </script>
</body>
</html>
